name: Daily Check-in
on: 
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0-6' # Every day at 00:00
permissions:
  contents: write
  actions: write
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache virtual environment
        id: cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') }}

      - name: Cache Chrome user data
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/getscipapers/ablesci/chrome_user_data
            ~/.config/getscipapers/wosonhj/chrome_user_data
          key: ${{ runner.os }}-chrome-user-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-chrome-user-data-

      - name: Install dependencies if cache is missed
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Load credentials
        run: |
          source .venv/bin/activate
          bash .devcontainer/set-secrets.sh --apply-credentials-base64 "${{ secrets.CREDS }}"

      - name: Run daily check-in
        run: |
          source .venv/bin/activate
          getscipapers checkin all

      - name: Keep scheduled workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/checkin.yml/enable"
